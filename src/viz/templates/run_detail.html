<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ run.run_id }} trajectory</title>
</head>
<body>
  <p><a href="/runs">All runs</a></p>
  <h1>{{ run.run_id }}</h1>
  <h2>{{ metric_title }}</h2>
  {{ chart | safe }}
  <h2>Transcript</h2>
  <table>
    <thead>
      <tr>
        <th>Turn</th>
        <th>Role</th>
        <th>Speaker</th>
        <th>Content</th>
      </tr>
    </thead>
    <tbody>
      {% for turn in transcript %}
      <tr>
        <td>{{ turn.turn_index }}</td>
        <td>{{ turn.role }}</td>
        <td>{{ turn.speaker }}</td>
        <td>{{ turn.content }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
