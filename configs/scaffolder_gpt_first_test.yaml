# GPT-4o + deterministic three-behavior scaffolder.

fetcher_config:
  fetcher: sharegpt
  data_path: data/human-ai_datasets/sharegpt_clean.json
  min_messages: 2
  max_messages: 6

analyzer_config:
  analyzer: similarity
  analyze_window: 5

agents:
  - type: llm
    provider: azure
    model: gpt-4o-2024-08-06
    system_prompt: >
      Continue the conversation naturally in one or two
      short sentences.
  - type: scaffolder
    min_content_tokens: 8
    novelty_threshold: 0.25
    continuity_threshold: 0.10
    history_window: 8
    stuck_turns: 2
    memory_cooldown: 2
    memory_size: 20
    similarity_threshold: 0.70
    novelty_nudge_rate: 0.20
    topic_source: topic_bank
    random_seed: 0

conversation_settings:
  turn_taking_method: round_robin
  analysis_policy: at_end
  checkpoint_enabled: false
  max_iterations: 50
  max_total_characters: 100000

agent_selection_method: round_robin
max_iterations: 50
max_total_characters: 100000
output_dir: results
