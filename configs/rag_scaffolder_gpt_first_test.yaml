# GPT-4o + web-search-grounded RAG scaffolder.

fetcher_config:
  fetcher: sharegpt
  data_path: data/human-ai_datasets/sharegpt_clean.json
  min_messages: 2
  max_messages: 6

analyzer_config:
  analyzer: similarity
  analyze_window: 5

agents:
  - type: llm
    provider: vllm
    model: Qwen/Qwen3-30B-A3B-Instruct-2507
    system_prompt: >
      Continue the conversation naturally in one or two
      short sentences.
    temperature: 0.7
    max_tokens: 300
    frequency_penalty: 0.0
    presence_penalty: 0.0
    top_p: 1.0
  - type: rag_scaffolder
    # three-behavior knobs (shared with the deterministic scaffolder)
    min_content_tokens: 8
    novelty_threshold: 0.25
    continuity_threshold: 0.10
    history_window: 8
    stuck_turns: 2
    memory_cooldown: 2
    memory_size: 20
    similarity_threshold: 0.70
    novelty_nudge_rate: 0.20
    topic_source: topic_bank
    random_seed: 0
    # RAG pipeline
    word_model: glove-wiki-gigaword-100
    # word_model_path: /path/to/glove.txt   # optional local override
    num_words: 3
    # duckduckgo | wikipedia | auto (DDG first, Wikipedia fallback)
    search_backend: auto
    search_results: 5
    fetch_page: true
    max_source_chars: 4000
    search_timeout: 8.0
    context_turns: 6
    nudge_max_tokens: 300

conversation_settings:
  turn_taking_method: round_robin
  analysis_policy: at_end
  checkpoint_enabled: false
  max_iterations: 100
  max_total_characters: 100000

agent_selection_method: round_robin
max_iterations: 100
max_total_characters: 100000
output_dir: results
