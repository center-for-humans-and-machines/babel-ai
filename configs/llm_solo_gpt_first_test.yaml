# GPT-4o solo self-dialogue (LLM only, no partner agents).

fetcher_config:
  fetcher: sharegpt
  data_path: data/human-ai_datasets/sharegpt_clean.json
  min_messages: 2
  max_messages: 6

analyzer_config:
  analyzer: similarity
  analyze_window: 5

agents:
  - type: llm
    provider: azure
    model: gpt-4o-2024-08-06
    system_prompt: >
      Continue the conversation naturally in one or two
      short sentences.
    temperature: 0.7
    max_tokens: 300
    frequency_penalty: 0.0
    presence_penalty: 0.0
    top_p: 1.0

conversation_settings:
  turn_taking_method: round_robin
  analysis_policy: at_end
  checkpoint_enabled: false
  max_iterations: 100
  max_total_characters: 100000

agent_selection_method: round_robin
max_iterations: 100
max_total_characters: 100000
output_dir: results
